name: arcamath
description: Arcamath - jogo arcade de equacoes (engenharia reversa do Emplake).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

# Versoes sugeridas. Se alguma falhar, rode: flutter pub upgrade --major-versions
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Firebase (plano Spark)
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  firebase_ui_auth: ^3.1.1
  firebase_ui_oauth_google: ^2.1.1
  firebase_ui_localizations: ^2.1.0

  # Estado, rotas, persistencia
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  shared_preferences: ^2.3.0

  # UI
  curved_navigation_bar: ^1.0.6
  google_fonts: ^8.2.1
  flutter_math_fork: ^0.7.3
  flutter_spinkit: ^5.2.1
  country_flags: ^4.1.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  #assets:
  #  - assets/sfx/
